databases:
  - name: fixmycity-db
    plan: free
    databaseName: fixmycity
    user: fixmycity

services:
  - type: web
    name: fixmycity-api
    runtime: docker
    plan: free
    rootDir: backend
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL
        fromDatabase:
          name: fixmycity-db
          property: connectionString
  - type: web
    name: fixmycity-web
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    envVars:
      - key: VITE_API_URL
        value: https://fixmycity-api.onrender.com/api
