databases:
  - name: fixmycity-db
    plan: free
    databaseName: fixmycity
    user: fixmycity

services:
  - type: web
    name: fixmycity-api
    runtime: java
    plan: free
    rootDir: backend
    buildCommand: mvn -DskipTests package
    startCommand: java -Dserver.port=$PORT -jar target/fixmycity-api-0.0.1-SNAPSHOT.jar
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL
        fromDatabase:
          name: fixmycity-db
          property: connectionString
  - type: web
    name: fixmycity-web
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://fixmycity-api.onrender.com/api
